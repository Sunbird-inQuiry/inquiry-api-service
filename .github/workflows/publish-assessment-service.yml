name: Build and Publish assessment-service docker image

on:
  push:
    tags:
      - '*'

env:
  CLOUD_STORE_GROUP_ID: ${{ vars.CLOUD_STORE_GROUP_ID }}
  CLOUD_STORE_ARTIFACT_ID: ${{ vars.CLOUD_STORE_ARTIFACT_ID }}
  CLOUD_STORE_VERSION: ${{ vars.CLOUD_STORE_VERSION }}
  KNOWLG_CORE_RELEASE_TAG: ${{ vars.KNOWLG_CORE_RELEASE_TAG }}
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Clone and build knowledge platform
        run: |
          git clone --branch ${{ env.KNOWLG_CORE_RELEASE_TAG }} https://github.com/Rakshitha-D/knowledge-platform.git
          cd knowledge-platform
          mvn clean install -Dmaven.test.skip=true -DCLOUD_STORE_GROUP_ID=${{env.CLOUD_STORE_GROUP_ID }} -DCLOUD_STORE_ARTIFACT_ID=${{ env.CLOUD_STORE_ARTIFACT_ID }} -DCLOUD_STORE_VERSION=${{ env.CLOUD_STORE_VERSION }} -Pknowlg-core
      
      - name: Build complete inquiry service
        run: mvn clean install -Dmaven.test.skip=true
      
      - name: Build assessment-service
        working-directory: assessment-api/assessment-service
        run: mvn play2:dist

      - name: create zip of assessment-service distribution
        working-directory: assessment-api/assessment-service/target
        run: zip -r assessment-service-1.0-SNAPSHOT-dist.zip assessment-service-1.0-SNAPSHOT.jar
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare Docker image name and tag
        run: |
          REPO_NAME_LOWERCASE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          TAG_NAME=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')
          BUILD_TAG="${TAG_NAME}_${{ steps.vars.outputs.commit_hash }}_${GITHUB_RUN_NUMBER}"

          echo "IMAGE_NAME=ghcr.io/${REPO_NAME_LOWERCASE}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${BUILD_TAG}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -f build/assessment-service/Dockerfile -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$IMAGE_TAG